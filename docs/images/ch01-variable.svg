<svg xmlns="http://www.w3.org/2000/svg" width="380" height="130" viewBox="0 0 380 130">
  <!-- Variable box -->
  <rect x="60" y="18" width="100" height="60" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="110" y="50" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">10</text>

  <!-- Annotation: value -->
  <text x="168" y="50" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#555">← 中身（値）</text>

  <!-- Connector line from box bottom to variable name -->
  <line x1="110" y1="78" x2="110" y2="95" stroke="#666" stroke-width="1.5"/>

  <!-- Variable name -->
  <text x="110" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">x</text>

  <!-- Annotation: variable name -->
  <text x="130" y="111" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#555">← 箱の名前（変数名）</text>
</svg>
