<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- 入力（引数）pill -->
  <rect x="70" y="10" width="180" height="36" rx="18" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="160" y="28" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">入力（引数）</text>

  <!-- Arrow down -->
  <line x1="160" y1="46" x2="160" y2="68" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 関数の処理 box -->
  <rect x="40" y="70" width="240" height="50" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="160" y="96" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">関数の処理</text>

  <!-- Arrow down -->
  <line x1="160" y1="120" x2="160" y2="142" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 出力（戻り値）pill -->
  <rect x="70" y="144" width="180" height="36" rx="18" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="160" y="162" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">出力（戻り値）</text>
</svg>
