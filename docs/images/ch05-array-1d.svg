<svg xmlns="http://www.w3.org/2000/svg" width="420" height="105" viewBox="0 0 420 105">
  <!-- "scores =" label -->
  <text x="60" y="68" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#333">scores =</text>

  <!-- Index labels -->
  <text x="100" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">0</text>
  <text x="160" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">1</text>
  <text x="220" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">2</text>
  <text x="280" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">3</text>
  <text x="340" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">4</text>
  <text x="185" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">インデックス</text>

  <!-- Cell 0: 80 -->
  <rect x="70" y="25" width="60" height="50" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="100" y="51" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">80</text>

  <!-- Cell 1: 60 -->
  <rect x="130" y="25" width="60" height="50" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="160" y="51" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">60</text>

  <!-- Cell 2: 90 -->
  <rect x="190" y="25" width="60" height="50" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="220" y="51" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">90</text>

  <!-- Cell 3: 70 -->
  <rect x="250" y="25" width="60" height="50" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="280" y="51" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">70</text>

  <!-- Cell 4: 55 -->
  <rect x="310" y="25" width="60" height="50" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="340" y="51" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">55</text>

  <!-- Index tick lines -->
  <line x1="100" y1="20" x2="100" y2="25" stroke="#aaa" stroke-width="1"/>
  <line x1="160" y1="20" x2="160" y2="25" stroke="#aaa" stroke-width="1"/>
  <line x1="220" y1="20" x2="220" y2="25" stroke="#aaa" stroke-width="1"/>
  <line x1="280" y1="20" x2="280" y2="25" stroke="#aaa" stroke-width="1"/>
  <line x1="340" y1="20" x2="340" y2="25" stroke="#aaa" stroke-width="1"/>

  <!-- scores(0) access hint -->
  <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">scores(0)</text>
  <text x="220" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">scores(2)</text>
  <text x="340" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">scores(4)</text>
</svg>
