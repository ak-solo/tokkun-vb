<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Animal (base class) box -->
  <rect x="100" y="15" width="220" height="56" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <rect x="100" y="15" width="220" height="28" rx="4" fill="#9673a6"/>
  <rect x="100" y="31" width="220" height="12" fill="#9673a6"/>
  <text x="210" y="30" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Animal（ベースクラス）</text>
  <text x="210" y="52" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Name, Age, ShowProfile()</text>

  <!-- Tree lines -->
  <!-- Vertical from Animal bottom to branch point -->
  <line x1="210" y1="71" x2="210" y2="100" stroke="#666" stroke-width="1.5"/>
  <!-- Horizontal bar -->
  <line x1="100" y1="100" x2="320" y2="100" stroke="#666" stroke-width="1.5"/>
  <!-- Left branch to Cat -->
  <line x1="100" y1="100" x2="100" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Right branch to Dog -->
  <line x1="320" y1="100" x2="320" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Inherits labels -->
  <text x="148" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Inherits</text>
  <text x="276" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Inherits</text>

  <!-- Cat (derived) box -->
  <rect x="15" y="130" width="170" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="15" y="130" width="170" height="28" rx="4" fill="#6c8ebf"/>
  <rect x="15" y="146" width="170" height="12" fill="#6c8ebf"/>
  <text x="100" y="145" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Cat（派生）</text>
  <text x="100" y="167" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Sleep()</text>

  <!-- Dog (derived) box -->
  <rect x="235" y="130" width="170" height="56" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <rect x="235" y="130" width="170" height="28" rx="4" fill="#82b366"/>
  <rect x="235" y="146" width="170" height="12" fill="#82b366"/>
  <text x="320" y="145" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">Dog（派生）</text>
  <text x="320" y="167" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Run()</text>
</svg>
