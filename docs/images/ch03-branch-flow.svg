<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- 条件を判定 label -->
  <text x="220" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">条件を判定</text>

  <!-- Arrow down to diamond -->
  <line x1="220" y1="28" x2="220" y2="55" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Diamond: center=(220,100), half-w=95, half-h=44 -->
  <polygon points="220,56 315,100 220,144 125,100" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="220" y="100" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">条件が真？</text>

  <!-- Left arrow (True): from (125,100) elbow to True box -->
  <polyline points="125,100 80,100 80,168" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="48" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#82b366" font-weight="bold">True</text>

  <!-- Right arrow (False): from (315,100) elbow to False box -->
  <polyline points="315,100 360,100 360,168" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="394" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b85450" font-weight="bold">False</text>

  <!-- True box -->
  <rect x="18" y="170" width="130" height="44" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="83" y="185" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">True のとき</text>
  <text x="83" y="202" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">処理 A</text>

  <!-- False box -->
  <rect x="296" y="170" width="130" height="44" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="361" y="185" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">False のとき</text>
  <text x="361" y="202" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">処理 B</text>
</svg>
